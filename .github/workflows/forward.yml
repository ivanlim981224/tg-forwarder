name: Telegram 消息转发

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟执行一次
  workflow_dispatch:          # 允许手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===== 频道对 1（原有）=====
  forward-1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: 运行转发
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          SOURCE_CHANNEL: ${{ secrets.SOURCE_CHANNEL }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          CUSTOM_URL: ${{ secrets.CUSTOM_URL }}
          LAST_ID_FILE: last_id_1.txt
        run: python forward_bot.py
      - name: 保存进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_id_1.txt
          git diff --staged --quiet || (git commit -m "chore: update last id 1" && git pull --rebase && git push)

  # ===== 频道对 2 =====
  forward-2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: 运行转发
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          SOURCE_CHANNEL: ${{ secrets.SOURCE_CHANNEL_2 }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL_2 }}
          CUSTOM_URL: ${{ secrets.CUSTOM_URL_2 }}
          LAST_ID_FILE: last_id_2.txt
        run: python forward_bot.py
      - name: 保存进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_id_2.txt
          git diff --staged --quiet || (git commit -m "chore: update last id 2" && git pull --rebase && git push)

